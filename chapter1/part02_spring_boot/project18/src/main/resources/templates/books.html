<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Books</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

    <div class="container">

        <h1>Danh sách sách</h1>

        <a th:href="@{/books/add}" class="btn">

            Thêm sách

        </a>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody>

                <tr th:each="book : ${books}">

                    <td th:text="${book.id}">
                    </td>

                    <td th:text="${book.title}">
                    </td>

                    <td th:text="${book.author}">
                    </td>

                    <td>

                        <a th:href="@{/books/edit/{id}(id=${book.id})}">
                            Sửa
                        </a>

                        <form th:action="@{/books/delete/{id}(id=${book.id})}" method="post" style="display:inline">

                            <button type="submit">
                                Xóa
                            </button>

                        </form>

                    </td>

                </tr>

            </tbody>

        </table>

        <br>

        <form th:action="@{/logout}" method="post">

            <button type="submit">
                Đăng xuất
            </button>

        </form>

    </div>

</body>

</html>
