name: Deploy Project113

on:
  push:
    branches:
      - main
    paths:
      - "chapter1/part03_spring_project/project113/src/main/resources/static/**"
      - ".github/workflows/deploy-project113.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Project113
        uses: actions/upload-pages-artifact@v4
        with:
          path: chapter1/part03_spring_project/project113/src/main/resources/static

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4